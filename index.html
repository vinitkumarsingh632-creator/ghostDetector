<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Detector</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Creepster&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="container">
      <img src="./src/assets/Forest.jpg" class="background"/>
      <audio id="bgSound" loop>
        <source src="./src/assets/HorrorSound.mp3" type="audio/mpeg">
      </audio>
      <div class="increaseVolume" id="volumeWarning">
          <div >
            <h2 style="text-align: center;padding: 1.2rem;color: rgb(9, 119, 15);font-size: 2rem;font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">WARNING</h2>
          </div>
          <div style="padding-left: 1rem;padding-right: 1rem;text-align: center;padding-bottom: 1rem;color: rgba(183, 180, 180, 0.534);font-size: 1.5rem;">
            For the full experience, increase your  <br/> volume and use headphones
          </div>
          <div style="text-align: center;padding-top: 1rem;padding-bottom: 1rem;font-size: 1.4rem;background-color: rgba(17, 95, 6, 0.343);border-bottom-left-radius: 20px;border-bottom-right-radius: 20px;color: rgba(183, 180, 180, 0.776);cursor: grab;" class="closeWarning">
            CLOSE
          </div>
      </div>
      <div class="AI" >
        <h2 style="text-align: center;color: rgb(245, 222, 179);padding-top: 0.5rem;padding-bottom: 0.5rem;">DISCLAIMER</h2>
          <div style="color: white;">This website was made by a human at an unreasonable hour</div>
          <div style="color: white;">If something breaks then, it's a feature</div>
          <div style="color: white;">If you see a ghost, then it's definitely a feature</div>
          <div style="color: white;">Have Fun. Don't Blame Me</div>

      </div>
           <div class="heading" style="text-align: center; padding-top: 2rem;">
              <div style="display: inline-block;" class="ghost">GHOST</div> <div style="display: inline-block;" class="detection">Detection</div> <div class="tool">tool</div>
           </div>
    </div>
    <script src="./src/main.js"></script>
  </body>
</html>
